<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet & Bold - ติดต่อเรา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #FFFBF0; color: #111111; }
        .brutalist-card { border: 4px solid #111111; box-shadow: 6px 6px 0px #111111; }
    </style>
</head>
<body class="bg-[#FFFBF0]">
    <header class="sticky top-0 z-50 bg-[#FFFBF0] border-b-4 border-black px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-800 tracking-wider uppercase bg-[#FFB347] px-3 py-1 brutalist-card">🍰 SWEET&BOLD</a>
        <nav class="hidden md:flex gap-6 font-600 text-lg">
            <a href="index.html" class="hover:underline decoration-4">หน้าแรก</a>
            <a href="services.html" class="hover:underline decoration-4">เมนูเค้ก</a>
            <a href="work.html" class="hover:underline decoration-4">ผลงานของเรา</a>
            <a href="process.html" class="hover:underline decoration-4">ขั้นตอนสั่งทำ</a>
            <a href="contact.html" class="underline decoration-4">ติดต่อเรา</a>
        </nav>
        <a href="contact.html" class="bg-black text-white px-5 py-2 font-600 brutalist-card hover:bg-[#FFB347] hover:text-black transition">สั่งเค้กเลย!</a>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-16">
        <h1 class="text-5xl font-800 mb-4 text-center">CONTACT US 📞</h1>
        <p class="text-center text-lg mb-12">สั่งเค้กหรือสอบถามข้อมูลเพิ่มเติมได้เลย</p>
        <div class="brutalist-card bg-[#FFDAB9] p-8">
            <form onsubmit="event.preventDefault(); alert('ส่งข้อความสำเร็จ! เราจะรีบติดต่อกลับนะจ๊ะ');" class="space-y-6">
                <div>
                    <label class="block font-800 mb-2">ชื่อของคุณ</label>
                    <input type="text" required class="w-full p-3 border-2 border-black bg-white font-400 focus:outline-none focus:ring-2 focus:ring-black">
                </div>
                <div>
                    <label class="block font-800 mb-2">เบอร์โทรศัพท์ / LINE ID</label>
                    <input type="text" required class="w-full p-3 border-2 border-black bg-white font-400 focus:outline-none focus:ring-2 focus:ring-black">
                </div>
                <div>
                    <label class="block font-800 mb-2">รายละเอียดเค้กที่ต้องการ</label>
                    <textarea rows="4" required class="w-full p-3 border-2 border-black bg-white font-400 focus:outline-none focus:ring-2 focus:ring-black"></textarea>
                </div>
                <button type="submit" class="w-full bg-black text-white py-4 font-800 text-lg brutalist-card hover:bg-[#FDFD96] hover:text-black transition">ส่งข้อความสั่งเค้ก</button>
            </form>
        </div>
    </main>

    <footer class="bg-black text-white py-12 px-6 border-t-4 border-black text-center">
        <p>© 2026 Sweet & Bold Studio. All rights reserved.</p>
    </footer>
</body>
</html>
